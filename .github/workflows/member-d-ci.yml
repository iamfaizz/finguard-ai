name: Member D CI

on:
  push:
    branches: [main, d/backend-phase6, harsh/ml-service-ci-tests]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build backend
        run: docker compose build backend
      - name: Backend tests
        run: docker compose run --rm --no-deps backend python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  forecast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-forecast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Forecast dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-integration.txt pytest httpx2
      - name: Forecast API contract tests
        run: pytest -q tests

  fraud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-fraud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Fraud dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt pytest httpx
      - name: Fraud API and feature tests
        run: pytest -q tests
