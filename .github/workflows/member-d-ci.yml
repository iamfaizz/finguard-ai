name: Member D CI

on:
  push:
    branches: [main, d/backend-phase6]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build backend
        run: docker compose build backend
      - name: Backend tests
        run: docker compose run --rm --no-deps backend python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
